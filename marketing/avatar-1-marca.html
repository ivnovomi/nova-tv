<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>NOVA TV · Foto de perfil</title>
<link rel="stylesheet" href="brand.css" />
<style>
  /* Profile picture: everything important stays inside the central circle. */
  .avatar { width: 1080px; height: 1080px; }
  .halo { position: absolute; inset: 170px; border-radius: 50%; background: radial-gradient(circle at 50% 55%, rgb(110 108 255 / 0.35), rgb(63 213 242 / 0.12) 45%, transparent 70%); }
  .ring { position: absolute; inset: 120px; border-radius: 50%; border: 3px solid rgb(160 170 255 / 0.16); box-shadow: inset 0 0 120px rgb(110 108 255 / 0.18); }
  .mark { position: absolute; left: 50%; top: 50%; width: 500px; transform: translate(-50%, -54%); filter: drop-shadow(0 0 40px rgb(63 213 242 / 0.55)) drop-shadow(0 0 90px rgb(110 108 255 / 0.5)); }
  .mark svg { display: block; width: 100%; height: auto; overflow: visible; }
</style>
</head>
<body>
<div class="canvas avatar">
  <div class="orb v" style="width:760px;height:760px;left:-200px;top:-220px;opacity:.6"></div>
  <div class="orb c" style="width:640px;height:640px;right:-200px;bottom:-200px;opacity:.5"></div>
  <div class="orb k" style="width:420px;height:420px;right:-60px;top:-120px;opacity:.28"></div>
  <div class="halo"></div>
  <div class="ring"></div>
  <div class="mark">
    <svg viewBox="0 0 100 92" aria-label="NOVA TV">
      <defs>
        <linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6e6cff"/><stop offset="1" stop-color="#3fd5f2"/></linearGradient>
      </defs>
      <path d="M8 86 L50 6 L92 86" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
    </svg>
  </div>
  <div class="grain"></div>
</div>
</body>
</html>
