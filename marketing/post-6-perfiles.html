<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>NOVA TV · Nuevo · Perfiles y control parental</title>
<link rel="stylesheet" href="brand.css" />
<style>
  h1 { position: absolute; top: 180px; left: 80px; right: 40px; font-size: 70px; }
  .q { position: absolute; top: 470px; left: 0; right: 0; text-align: center; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; font-size: 34px; color: var(--ink2); }
  .faces { position: absolute; top: 560px; left: 0; right: 0; display: flex; justify-content: center; gap: 44px; }
  .lock { position: absolute; top: 950px; left: 80px; right: 80px; display: flex; align-items: center; gap: 30px; padding: 34px 38px; }
  .lock h2 { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em; }
  .lock p { margin-top: 8px; font-size: 26px; line-height: 1.4; color: var(--ink2); }
  .foot { position: absolute; bottom: 60px; left: 80px; font-size: 24px; color: var(--ink3); }
</style>
</head>
<body>
<div class="canvas post">
  <div class="orb v" style="width:800px;height:800px;left:-360px;top:-300px;opacity:.55"></div>
  <div class="orb k" style="width:600px;height:600px;right:-280px;top:400px;opacity:.28"></div>
  <div class="orb c" style="width:640px;height:640px;left:-240px;top:1000px;opacity:.3"></div>
  <div class="grain"></div>

  <div class="series-head">
    <span class="wordmark">
      <svg viewBox="0 0 176 40" aria-label="NOVA">
        <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6e6cff"/><stop offset="1" stop-color="#3fd5f2"/></linearGradient></defs>
        <g fill="none" stroke-width="4.6" stroke-linecap="square"><path d="M3 37V3l28 34V3" stroke="#f4f6ff"/><circle cx="66" cy="20" r="17" stroke="#f4f6ff"/><path d="M96 3l17 34 17-34" stroke="#f4f6ff"/><path d="M140 37l17-34 17 34" stroke="url(#g)"/></g>
      </svg>
      <span class="tv">TV</span>
    </span>
    <span class="badge-new"><i></i>NUEVO</span>
  </div>

  <h1 class="display">Cada uno con lo suyo.<br /><span class="grad-text">Y los peques, solo lo suyo.</span></h1>

  <p class="q">¿Quién está viendo?</p>
  <div class="faces">
    <div class="who"><span class="face focus" style="background:radial-gradient(circle at 30% 25%,#6e6cff,#6e6cff99 60%,#6e6cff55)">😎</span><b>Papá</b></div>
    <div class="who"><span class="face" style="background:radial-gradient(circle at 30% 25%,#ff5c9a,#ff5c9a99 60%,#ff5c9a55)">🦄</span><b>Mamá</b></div>
    <div class="who"><span class="face" style="background:radial-gradient(circle at 30% 25%,#ffb547,#ffb54799 60%,#ffb54755)">🦊</span><b>Lucía</b><span class="kids">Infantil</span></div>
    <div class="who"><span class="face" style="background:radial-gradient(circle at 30% 25%,#3ddc97,#3ddc9799 60%,#3ddc9755)">🐼</span><b>Marco</b><span class="kids">Infantil</span></div>
  </div>

  <div class="card lock">
    <span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
    <div>
      <h2>Control parental de verdad</h2>
      <p>Los perfiles infantiles solo ven canales y apps aptos. Para salir, hace falta el PIN.</p>
    </div>
  </div>

  <p class="foot">NOVA TV · Tu PC, como una Smart TV · Para Windows</p>
</div>
</body>
</html>
